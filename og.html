<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>OG — Сертификат для Елизаветы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Manrope:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--ink:#fcf9f7;--cream:#2e2325;--gold:#c4868e;--gold-light:#e3a3ab;--gold-deep:#9c626a;
    --serif:"Cormorant Garamond",Garamond,"Times New Roman",Georgia,serif;--sans:"Manrope",Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:var(--ink)}
  body{position:relative;color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .bgtxt{position:absolute;left:-40px;white-space:nowrap;font-family:var(--serif);font-style:italic;font-weight:300;color:var(--gold-deep)}
  .b1{top:-30px;font-size:210px;opacity:.035}
  .b2{top:250px;font-size:120px;opacity:.05;left:-260px}
  .b3{top:430px;font-size:230px;opacity:.03;left:-120px}
  .glow{position:absolute;inset:0;background:
     radial-gradient(60% 80% at 22% 50%,rgba(196,134,142,.16),transparent 60%),
     radial-gradient(120% 90% at 50% 50%,transparent 45%,rgba(252,249,247,.9) 100%)}
  .frame{position:absolute;inset:34px;border:1px solid rgba(196,134,142,.55)}
  .frame2{position:absolute;inset:44px;border:1px solid rgba(196,134,142,.18)}
  .content{position:absolute;inset:0;display:flex;align-items:center;padding:0 110px;gap:86px}
  .seal{flex:none;width:250px;height:250px;border-radius:50%;display:grid;place-items:center;
     background:radial-gradient(circle at 35% 30%,#ffffff,#f6e1e3 70%);
     box-shadow:0 0 0 1.5px rgba(196,134,142,.8),0 0 0 14px var(--ink),0 0 0 15.5px rgba(196,134,142,.32),0 0 90px rgba(196,134,142,.22)}
  .seal span{font-family:var(--serif);font-style:italic;font-weight:400;font-size:150px;line-height:1;transform:translateY(-6px)}
  .gold{background:linear-gradient(120deg,var(--gold-deep) 0%,var(--gold) 30%,var(--gold-light) 50%,var(--gold) 70%,var(--gold-deep) 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent}
  .cap{font-size:17px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
  .title{margin-top:22px;font-family:var(--serif);font-weight:300;font-size:96px;line-height:1}
  .title em{font-style:italic;font-weight:400}
  .rule{margin:34px 0 30px;width:120px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
  .limit{display:flex;align-items:center;gap:22px;font-family:var(--serif);font-size:36px;color:rgba(46,35,37,.8)}
  .limit .inf{font-size:84px;line-height:.7;font-weight:300}
  .meta{margin-top:30px;font-size:14px;letter-spacing:.32em;text-transform:uppercase;color:rgba(46,35,37,.45)}
</style>
</head>
<body>
  <div class="bgtxt b1">Polène · Jacquemus · Strathberry · Longchamp</div>
  <div class="bgtxt b2">A.P.C. · Tory Burch · Marc Jacobs · Furla · By Far · Coccinelle</div>
  <div class="bgtxt b3">Coccinelle · Polène · Furla · Jacquemus</div>
  <div class="glow"></div>
  <div class="frame"></div><div class="frame2"></div>
  <div class="content">
    <div class="seal"><span class="gold">Е</span></div>
    <div>
      <div class="cap">Подарочный сертификат · № 15·11·2026</div>
      <div class="title">Сертификат<br>для&nbsp;<em class="gold">Елизаветы</em></div>
      <div class="rule"></div>
      <div class="limit">Лимит<span class="inf gold">∞</span>без ограничений</div>
      <div class="meta">Бессрочно</div>
    </div>
  </div>
</body>
</html>
